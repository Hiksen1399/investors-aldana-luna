services:
  postgres:
    image: postgres:17-alpine
    container_name: mi-portafolio-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: mi_portafolio
      POSTGRES_USER: portfolio
      POSTGRES_PASSWORD: portfolio_dev
    ports:
      - "5432:5432"
    volumes:
      - portfolio_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portfolio -d mi_portafolio"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  portfolio_postgres_data:

