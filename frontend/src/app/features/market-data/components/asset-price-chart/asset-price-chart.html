<section class="price-chart"><header><div><strong>{{symbol}}</strong><span>Historial OHLCV · Twelve Data</span></div><div class="ranges">@for(item of ranges;track item){<button [class.active]="range()===item" (click)="selectRange(item)">{{item}}</button>}</div></header><div class="chart-wrap">@if(loading()){<div class="chart-loading"><i class="bi bi-arrow-clockwise"></i> Cargando historial…</div>}@if(error()){<div class="chart-error"><i class="bi bi-exclamation-triangle"></i> {{error()}}</div>}@if(tooltip()){<div class="tooltip">{{tooltip()}}</div>}<div #chartHost class="chart-host"></div></div></section>
